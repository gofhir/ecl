name: Filter constraints
fixture: ../fixtures/standard.yaml
specSection: "5.4 Filters"

cases:
  - name: term filter substring match
    expression: '<< 404684003 {{ D term = "infarction" }}'
    expectedIds: ["22298006"]

  - name: term filter case-insensitive
    expression: '<< 404684003 {{ D term = "INFARCTION" }}'
    expectedIds: ["22298006"]

  - name: term filter wild glob (anchored prefix)
    expression: '<< 404684003 {{ D term = wild: "Diabet*" }}'
    expectedIds: ["73211009"]

  - name: term filter wild glob (substring with leading *)
    expression: '<< 404684003 {{ D term = wild: "*diabet*" }}'
    expectedIds: ["73211009", "11687002"]

  - name: language filter en only
    expression: '<< 22298006 {{ D language = en }}'
    expectedIds: ["22298006"]

  - name: language filter multi-value any-of (en OR es)
    expression: '<< 22298006 {{ D language = (en OR es) }}'
    expectedIds: ["22298006"]

  - name: language filter es only finds bilingual concept
    expression: '<< 404684003 {{ D language = es }}'
    expectedIds: ["22298006"]

  # The negated description filters moved to 09-errors.yaml: their semantics are
  # a per-description-row negation, which cannot be expressed as a set operation
  # against the current DataProvider contract. The evaluator now reports
  # ErrUnsupportedFeature instead of returning base.Minus(matches), which was
  # wrong for any concept holding both a matching and a non-matching description.

  # Concept filters, in contrast, identify sets of concepts, so each clause can
  # be composed independently. A single global negate flag used to discard the
  # positive sibling clauses.
  - name: concept filter with mixed polarity keeps the positive clause
    expression: '<< 404684003 {{ C definitionStatusId = 900000000000073002, moduleId != 900000000000012004 }}'
    expectedIds: ["22298006", "73211009"]

  # 22298006, 73211009 and 11687002 are in the core module, so "!=" excludes all
  # three; 95566004 is in the model component module and the rest declare none.
  - name: concept filter negated module
    expression: '<< 404684003 {{ C moduleId != 900000000000207008 }}'
    expectedIds: ["404684003", "64572001", "95566004"]

  - name: concept filter positive module
    expression: '<< 404684003 {{ C moduleId = 900000000000207008 }}'
    expectedIds: ["11687002", "22298006", "73211009"]

  - name: concept filter definition status
    expression: '<< 404684003 {{ C definitionStatusId = 900000000000073002 }}'
    expectedIds: ["22298006", "73211009"]

  # The active axis belongs to FilterConcepts alone. AllConcepts used to filter
  # by the active flag, and since the wildcard is resolved BEFORE filters are
  # applied, `* {{ C active = false }}` could never return anything.
  - name: wildcard with active false returns the inactive concepts
    expression: "* {{ C active = false }}"
    expectedIds: ["11111111", "22222222", "33333333"]

  - name: descendants with active true excludes nothing here
    expression: "<< 73211009 {{ C active = true }}"
    expectedIds: ["11687002", "73211009"]

  # Dialect filters. The parser used to discard the filter's contents and force
  # Op to "=", so the evaluator built empty options, matched nothing and
  # intersected: EVERY dialect expression returned the empty set silently.
  # 22298006 is preferred in en-gb and acceptable in en-us; 73211009 exists only
  # in en-us, so the two refsets select different sets.
  - name: dialect filter by refset id (en-gb)
    expression: "<< 404684003 {{ D dialectId = 900000000000508004 }}"
    expectedIds: ["22298006"]

  - name: dialect filter by refset id (en-us)
    expression: "<< 404684003 {{ D dialectId = 900000000000509007 }}"
    expectedIds: ["22298006", "73211009"]

  # Member field filters with a literal value. This used to fail at runtime with
  # "unsupported AST node type: *ast.StringValue" because the literal was routed
  # through Evaluate, which has nothing to resolve for it.
  - name: member field filter with a string value
    expression: '^ 900000000000497000 {{ M mapTarget = "G30.9" }}'
    expectedIds: ["22298006"]

  - name: member field filter with a negated string value
    expression: '^ 900000000000497000 {{ M mapTarget != "G30.9" }}'
    expectedIds: ["73211009"]

  # The default "match" search type is word-prefix, not substring: every word of
  # the search term must be a prefix of some word of the description, in any
  # order. The reference fixture used strings.Contains, which was wrong in both
  # directions -- and since the README points implementors at that fixture, it
  # taught the wrong semantics.
  - name: term match ignores word order
    expression: '<< 404684003 {{ D term = "infarction myocardial" }}'
    expectedIds: ["22298006"]

  - name: term match does not match mid-word
    expression: '<< 404684003 {{ D term = "farct" }}'
    expectedIds: []

  - name: term match accepts a word prefix
    expression: '<< 404684003 {{ D term = "infarct" }}'
    expectedIds: ["22298006"]

  - name: term match requires every word to match
    expression: '<< 404684003 {{ D term = "myocardial diabetes" }}'
    expectedIds: []
