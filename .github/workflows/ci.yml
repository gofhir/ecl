name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default: no job needs write access to the repository.
permissions:
  contents: read

env:
  GO_VERSION: "1.24"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3

      # go.mod carried yaml.v3 as "// indirect" while internal/conformance
      # imported it directly, so this step failed the day it was added.
      - name: go.mod is tidy
        run: go mod tidy -diff

  test:
    name: Test (Go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every combination rather than stopping at the first failure: a
      # platform-specific break is exactly what this matrix exists to reveal.
      fail-fast: false
      matrix:
        # The README offers this library for edge devices, so it cannot be
        # verified on one Linux with one Go version.
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.24", "1.25"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go${{ matrix.go }}-

      - name: Run tests
        run: go test -race ./...

      # Runs the same suites through the CLI. Guards the binary itself and the
      # paths it resolves, which the unit tests do not exercise.
      - name: Conformance suite (CLI)
        run: go run ./cmd/gofhir-ecl conformance

      - name: Verify module
        run: go mod verify

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
        continue-on-error: true

  generated:
    name: Generated parser is current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Java (ANTLR runs on the JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Nothing detected an edited ECL.g4 that was never regenerated, or a
      # hand-edited file under ecl/grammar/. Both would be a 48k-line diff
      # nobody could review.
      - name: Regenerate and diff
        run: |
          make generate
          git diff --exit-code -- ecl/grammar/ || {
            echo "::error::ecl/grammar/ is out of date with ECL.g4 — run 'make generate' and commit the result"
            exit 1
          }

  major-bump:
    name: No unintended major bump
    runs-on: ubuntu-latest
    # Only meaningful on a pull request: by the time a commit reaches main,
    # release-please has already read it.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The full history is needed to walk the commits this PR adds.
          fetch-depth: 0

      # release-please turns a conventional-commit breaking-change marker into a
      # MAJOR bump. The two guards in release-please-config.json do not prevent
      # it: bump-minor-pre-major and bump-patch-for-minor-pre-major only apply
      # below 1.0.0, and this module is past that. So the sole thing standing
      # between a stray "!" and v2.0.0 -- a new import path and a migration for
      # every consumer -- is somebody noticing while writing the commit message.
      #
      # This noticed one in this very repository: a "fix(ecl)!:" written out of
      # habit for a change that was not breaking.
      #
      # A major is a legitimate decision, just never an accidental one. Label the
      # pull request "major-release" to say it is deliberate.
      - name: Reject breaking-change markers unless the PR is labelled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A marked type ("feat!:", "fix(scope)!:") or a BREAKING CHANGE footer.
          offenders=$(
            git log --format='%H %s' "${BASE_SHA}..HEAD" \
              | grep -E ' [a-z]+(\([^)]*\))?!:' || true
          )
          footers=$(
            git log --format='%H%n%b' "${BASE_SHA}..HEAD" \
              | grep -nE '^BREAKING[ -]CHANGE:' || true
          )

          if [ -z "$offenders" ] && [ -z "$footers" ]; then
            echo "No breaking-change markers; release-please will bump the minor or patch."
            exit 0
          fi

          if gh pr view "$PR" --json labels --jq '.labels[].name' | grep -qx 'major-release'; then
            echo "Breaking-change markers found, and the PR is labelled major-release. Proceeding."
            [ -n "$offenders" ] && echo "$offenders"
            [ -n "$footers" ] && echo "$footers"
            exit 0
          fi

          echo "::error::This PR carries a conventional-commit breaking-change marker, so release-please would publish a MAJOR version. If that is intended, label the PR 'major-release'. If not, reword the commits."
          [ -n "$offenders" ] && echo "$offenders"
          [ -n "$footers" ] && echo "$footers"
          exit 1
