name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default: no job needs write access to the repository.
permissions:
  contents: read

env:
  GO_VERSION: "1.24"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3

      # go.mod carried yaml.v3 as "// indirect" while internal/conformance
      # imported it directly, so this step failed the day it was added.
      - name: go.mod is tidy
        run: go mod tidy -diff

  test:
    name: Test (Go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every combination rather than stopping at the first failure: a
      # platform-specific break is exactly what this matrix exists to reveal.
      fail-fast: false
      matrix:
        # The README offers this library for edge devices, so it cannot be
        # verified on one Linux with one Go version.
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.24", "1.25"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go${{ matrix.go }}-

      - name: Run tests
        run: go test -race ./...

      # Runs the same suites through the CLI. Guards the binary itself and the
      # paths it resolves, which the unit tests do not exercise.
      - name: Conformance suite (CLI)
        run: go run ./cmd/gofhir-ecl conformance

      - name: Verify module
        run: go mod verify

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
        continue-on-error: true

  generated:
    name: Generated parser is current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Java (ANTLR runs on the JVM)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Nothing detected an edited ECL.g4 that was never regenerated, or a
      # hand-edited file under ecl/grammar/. Both would be a 48k-line diff
      # nobody could review.
      - name: Regenerate and diff
        run: |
          make generate
          git diff --exit-code -- ecl/grammar/ || {
            echo "::error::ecl/grammar/ is out of date with ECL.g4 — run 'make generate' and commit the result"
            exit 1
          }

  major-bump:
    name: No unintended major bump
    runs-on: ubuntu-latest
    # Only meaningful on a pull request: by the time a commit reaches main,
    # release-please has already read it.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The full history is needed to walk the commits this PR adds.
          fetch-depth: 0

      # release-please turns a conventional-commit breaking-change marker into a
      # MAJOR bump. The two guards in release-please-config.json do not prevent
      # it: bump-minor-pre-major and bump-patch-for-minor-pre-major only apply
      # below 1.0.0, and this module is past that. So the sole thing standing
      # between a stray "!" and v2.0.0 -- a new import path and a migration for
      # every consumer -- is somebody noticing while writing the commit message.
      #
      # This noticed one in this very repository: a "fix(ecl)!:" written out of
      # habit for a change that was not breaking.
      #
      # A major is a legitimate decision, just never an accidental one. Label the
      # pull request "major-release" to say it is deliberate.
      - name: Reject breaking-change markers unless the PR is labelled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A marked type ("feat!:", "fix(scope)!:") or a BREAKING CHANGE footer.
          offenders=$(
            git log --format='%H %s' "${BASE_SHA}..HEAD" \
              | grep -E ' [a-z]+(\([^)]*\))?!:' || true
          )
          footers=$(
            git log --format='%H%n%b' "${BASE_SHA}..HEAD" \
              | grep -nE '^BREAKING[ -]CHANGE:' || true
          )

          if [ -z "$offenders" ] && [ -z "$footers" ]; then
            echo "No breaking-change markers; release-please will bump the minor or patch."
            exit 0
          fi

          if gh pr view "$PR" --json labels --jq '.labels[].name' | grep -qx 'major-release'; then
            echo "Breaking-change markers found, and the PR is labelled major-release. Proceeding."
            [ -n "$offenders" ] && echo "$offenders"
            [ -n "$footers" ] && echo "$footers"
            exit 0
          fi

          echo "::error::This PR carries a conventional-commit breaking-change marker, so release-please would publish a MAJOR version. If that is intended, label the PR 'major-release'. If not, reword the commits."
          [ -n "$offenders" ] && echo "$offenders"
          [ -n "$footers" ] && echo "$footers"
          exit 1

  fuzz:
    name: Fuzz the parser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Parse is reachable from untrusted input in the use this library is built
      # for -- a FHIR server taking an expression from a URL -- and the absence of
      # this job is how the parser came to spend 7.6 seconds and 92 million
      # allocations on a 2.2 KB expression without anyone noticing.
      #
      # A short budget: this is a regression net over the committed seed corpus,
      # not a fuzzing campaign. Twelve seconds was enough to find a 26-byte input
      # that grew the heap without bound, so a minute is not a token gesture.
      # Run longer locally with `make fuzz FUZZTIME=10m`.
      # One step per package: -fuzz takes a single package and a single target.
      # The ECL parser gets the longest budget because it is the one that was
      # actually broken, and it is the slowest to explore -- ANTLR runs at roughly
      # 28k executions per second against 220k for the hand-written SCG parser.
      - name: Fuzz the ECL parser
        run: go test ./ecl/ -run '^$' -fuzz '^FuzzParse$' -fuzztime 60s

      - name: Fuzz the SCG parser
        run: go test ./scg/ -run '^$' -fuzz '^FuzzParse$' -fuzztime 30s

      # The round-trip property is a separate target because -fuzz takes one at a
      # time, and it is the stronger of the two: it catches an asymmetry between
      # parsing and rendering, which is the class that produced a 26-byte
      # heap-exhausting input in the ECL parser. It found two on the day it was
      # written.
      - name: Fuzz the SCG parse/render round trip
        run: go test ./scg/ -run '^$' -fuzz '^FuzzParseRenderParse$' -fuzztime 30s

      # This one runs the loader AND the validator: a model that parses but then
      # breaks Validate is the worse bug, because it surfaces far from its cause.
      - name: Fuzz the MRCM loader
        run: go test ./mrcm/ -run '^$' -fuzz '^FuzzLoadFromBytes$' -fuzztime 30s

      # A crasher is written under testdata/fuzz/ and is the whole value of the
      # run: without this, the input that failed dies with the runner and the
      # finding has to be rediscovered.
      - name: Upload any crasher
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: |
            ecl/testdata/fuzz/
            scg/testdata/fuzz/
            mrcm/testdata/fuzz/
          if-no-files-found: ignore
