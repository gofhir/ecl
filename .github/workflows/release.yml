name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      # Point at the config file. Passing release-type inline made the action
      # IGNORE release-please-config.json entirely, so settings written there --
      # bump-minor-pre-major and bump-patch-for-minor-pre-major among them --
      # never applied. That is how the jump to v1.0.0 happened without anyone
      # deciding on it.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please writes the Release body from the commit subjects it
      # collected, and knows nothing about docs/releases/. Those files carry what
      # a subject line cannot: what actually changed in behaviour, why, and what
      # to check before upgrading. Without this step they exist in the repository
      # and nobody reading the Release ever learns of them.
      #
      # The tag is the link target rather than a branch, so the notes stay pinned
      # to the version they describe.
      - name: Link the hand-written release notes
        # Compared against the string, not just tested for truthiness: a
        # GitHub expression treats the non-empty string 'false' as true, so
        # `if: outputs.release_created` would fire on a run that created nothing.
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          notes="docs/releases/${TAG}.md"

          # Read the file from the tag rather than checking out: this job has no
          # working copy, and the tag is the only ref guaranteed to hold the
          # released content.
          if ! gh api "repos/${GITHUB_REPOSITORY}/contents/${notes}?ref=${TAG}" \
                 --jq .name >/dev/null 2>&1; then
            echo "No hand-written notes at ${notes} for this release; leaving the generated body as it is."
            exit 0
          fi

          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/${notes}"
          gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json body --jq .body > generated-body.md
          {
            printf '📝 **[Full release notes](%s)** — every behaviour change, why it changed, and what to check before upgrading.\n\n' "$url"
            printf -- '---\n\n'
            cat generated-body.md
          } > release-body.md
          gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --notes-file release-body.md

      # The ci.yml major-bump job checks the COMMITS of a pull request. It cannot
      # see a major that comes from anywhere else, and one did: release-please
      # proposed 2.0.0 for what was meant to be v1.2.0, because
      # include-component-in-tag defaults to true in manifest mode, so it looked
      # for a release tagged "go-ecl-v1.1.0", found none against the real "v1.1.0"
      # tags, re-read the entire history, and re-counted a "feat(ecl)!:" that had
      # already shipped in v1.0.0.
      #
      # Nothing detected that. The commits were clean; the CONFIGURATION was not.
      # So this reads what release-please actually decided -- the version in the
      # manifest on its own branch -- rather than trusting any input to it.
      - name: A proposed major must be deliberate
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          manifest_at() {
            gh api "repos/${GITHUB_REPOSITORY}/contents/.release-please-manifest.json?ref=$1" \
              --jq .content | base64 -d | jq -r '."."'
          }

          # --repo on every call: this job deliberately has no checkout, and
          # without it gh tries to infer the repository from git and dies with
          # "fatal: not a git repository".
          branch=$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].headRefName')
          if [ -z "$branch" ] || [ "$branch" = "null" ]; then
            echo "No open release PR, so there is no proposed version to check."
            exit 0
          fi

          pr=$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --head "$branch" --json number --jq '.[0].number')
          current=$(manifest_at "${GITHUB_REF_NAME}")
          proposed=$(manifest_at "$branch")
          echo "Release PR #${pr} on ${branch}: ${current} -> ${proposed}"

          if [ "${proposed%%.*}" = "${current%%.*}" ]; then
            echo "Same major; nothing to flag."
            exit 0
          fi

          if gh pr view "$pr" --repo "${GITHUB_REPOSITORY}" --json labels --jq '.labels[].name' | grep -qx 'major-release'; then
            echo "Major bump proposed, and PR #${pr} is labelled major-release. Deliberate."
            exit 0
          fi

          echo "::error::Release PR #${pr} proposes ${proposed}, a MAJOR bump from ${current}. For a Go module that means a /v2 import path and a migration for every consumer. If it is intended, label the PR 'major-release'. If not, the cause is upstream of the PR -- check release-please-config.json and whether the last release's tag is the one release-please looks for."
          exit 1
