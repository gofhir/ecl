version: "2"
run:
  modules-download-mode: readonly
  tests: true
  allow-parallel-runners: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    - bodyclose
    - cyclop
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - forcetypeassert
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gomoddirectives
    - gosec
    - govet
    - ineffassign
    - maintidx
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - tparallel
    - unconvert
    - unparam
    - unused
    - wastedassign
    - whitespace
  settings:
    # The complexity gates were set above the worst function in the codebase
    # (Evaluate measured gocognit 77, gocyclo 51), so they could never fire. They
    # now sit at values that bite; functions that legitimately exceed them are
    # excluded by path+text below, which is honest, where an unreachable
    # threshold merely looked like a gate.
    cyclop:
      max-complexity: 25
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gocognit:
      min-complexity: 40
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 25
    godot:
      scope: toplevel
      capital: true
    gosec:
      excludes:
        - G104
        - G304
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    maintidx:
      # The default is 20; anything lower than that is not a gate.
      under: 20
    misspell:
      locale: US
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          arguments:
            - checkPrivateReceivers
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    generated: lax
    rules:
      - linters:
          - cyclop
          - errcheck
          - forcetypeassert
          - gocognit
          - goconst
          - gocyclo
          - gosec
          - maintidx
        path: _test\.go
      - linters:
          - cyclop
        path: (.+)_test\.go
      - linters:
          - revive
        path: ecl/parser\.go
        text: "exported method astBuilder\\.Visit"
      - linters:
          - revive
        path: ecl/parser\.go
        text: "exported method eclErrorListener\\.SyntaxError"
      - linters:
          - forcetypeassert
        path: ecl/parser\.go
      # Type-switch dispatchers. Their complexity is the number of AST node
      # kinds, not tangled logic: splitting them would spread one exhaustive
      # switch across several functions and make a missing case harder to spot.
      # Excluded by name so a NEW complex function still trips the gate.
      - linters:
          - gocognit
          - gocyclo
          - cyclop
          - maintidx
        path: ecl/evaluator\.go
        # cyclop and gocyclo word their messages differently, so match the name.
        text: "evaluateNode"
      - linters:
          - gocyclo
          - cyclop
        path: cmd/gofhir-ecl/explain\.go
        text: "printAST"
      # Filter builders: one branch per filter kind, each a few lines. Same
      # reasoning as above. TODO: fold the repeated
      # "evaluate, else fall back to the literal SCTID" shape into a helper —
      # resolveFilterIDs already does it for two of them.
      - linters:
          - gocognit
        path: ecl/parser\.go
        text: "build(TypeFilter|DefinitionStatusFilter)"
      # evaluateFiltered and filterByConcreteValue are genuinely worth splitting;
      # excluded for now so the gate can be enabled without a refactor in the
      # same change.
      - linters:
          - gocognit
          - gocyclo
          - cyclop
        path: ecl/evaluator\.go
        text: "(evaluateFiltered|filterByConcreteValue)"
      # The in-memory DataProvider implementation methods are required to be
      # exported (they satisfy the ecl.DataProvider interface) but the
      # receiver type is intentionally unexported.
      # UnimplementedDataProvider's 18 methods are interface satisfaction only.
      # The type's doc comment explains all of them; a one-line comment per method
      # would be 18 restatements of "returns ErrUnsupportedFeature".
      - linters:
          - revive
        path: ecl/unimplemented\.go
        text: "exported method UnimplementedDataProvider\\."
      - linters:
          - revive
        path: ecl/providertest/fixture\.go
        text: "exported method inMemoryProvider\\."
      # CLI subcommands print to stdout via fmt.Fprintf/Fprintln; their
      # error returns are not actionable in a CLI context.
      - linters:
          - errcheck
        path: cmd/gofhir-ecl/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  new: false
  fix: false
severity:
  default: warning
  rules:
    - linters:
        - gosec
      severity: error
    - linters:
        - errcheck
      severity: error
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: interface{}
          replacement: any
        - pattern: a[b:len(a)]
          replacement: a[b:]
    goimports:
      local-prefixes:
        - github.com/gofhir/ecl
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
