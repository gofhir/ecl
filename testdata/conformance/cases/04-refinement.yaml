name: Refinements (basic, grouped, reverse, dot)
fixture: ../fixtures/standard.yaml
specSection: "5.3 Refinements"

cases:
  - name: ungrouped attribute equality
    expression: "<< 404684003 : 363698007 = 74281007"
    expectedIds: ["22298006"]

  - name: ungrouped attribute with hierarchical value
    expression: "<< 404684003 : 363698007 = << 74281007"
    expectedIds: ["22298006"]

  - name: attribute name wildcard via Any (*)
    expression: "<< 404684003 : * = 74281007"
    expectedIds: ["22298006"]

  # Re-baselined when the fixture gained a second relationship group on
  # 22298006 (needed to make attribute-group cardinality verifiable at all).
  # MI now has two finding sites, one per group, and dot notation returns the
  # union of the targets — which makes this a stronger case than the
  # single-target version it replaces.
  - name: dot notation traversal returns every target (finding sites of MI)
    expression: "(22298006).363698007"
    expectedIds: ["74281007", "113331007"]

  - name: reverse attribute - body structure is a finding-site target of clinical findings
    expression: "74281007 : R 363698007 = << 404684003"
    expectedIds: ["74281007"]

  - name: refinement with two attributes (AND in same group)
    expression: "<< 404684003 : { 363698007 = 74281007, 116676008 = 55641003 }"
    expectedIds: ["22298006"]

  # Disjunction. The parser used to flatten AND and OR into one list, so these
  # were evaluated as intersections and returned the empty set.
  - name: disjunction of ungrouped attributes
    expression: "* : 363698007 = 74281007 OR 363698007 = 113331007"
    expectedIds: ["22298006", "73211009"]

  - name: conjunction of the same two clauses still intersects
    expression: "* : 363698007 = 74281007 , 363698007 = 113331007"
    expectedIds: ["22298006"]

  - name: disjunction of attribute groups
    expression: "* : { 363698007 = 74281007 } OR { 1142139005 = #5 }"
    expectedIds: ["22298006", "73211009"]

  - name: conjunction of attribute groups matches nobody
    expression: "* : { 363698007 = 74281007 } , { 1142139005 = #5 }"
    expectedIds: []

  - name: disjunction inside an attribute group
    expression: "* : { 363698007 = 113331007 OR 116676008 = 55641003 }"
    expectedIds: ["22298006", "73211009"]

  # The grammar cannot put a group inside an attribute set, so the comma
  # promotes the group to the refinement level. Dispatching on the attribute
  # tree alone would drop the group and widen the result.
  - name: attribute and group combined with a comma
    expression: "* : 363698007 = 74281007 , { 116676008 = 55641003 }"
    expectedIds: ["22298006"]

  - name: attribute and group combined where the group excludes everything
    expression: "* : 363698007 = 74281007 , { 1142139005 = #5 }"
    expectedIds: []

  # Parentheses are a scope: flattening them let the trailing conjunct escape
  # the union.
  - name: parenthesised disjunction keeps its scope
    expression: "* : ({ 363698007 = 74281007 } OR { 363698007 = 113331007 }) , 1142139005 = #5"
    expectedIds: ["73211009"]

  - name: parenthesised disjunction of ungrouped attributes
    expression: "* : (363698007 = 74281007 OR 1142139005 = #5)"
    expectedIds: ["22298006", "73211009"]
